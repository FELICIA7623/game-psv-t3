let i=0,score=0,answered=false,name="",klass="";
function startGame(){name=document.getElementById("nama").value.trim();klass=document.getElementById("kelas").value.trim();if(!name||!klass){alert("Sila masukkan Nama Pelajar dan Kelas.");return}document.getElementById("start").classList.add("hidden");document.getElementById("game").classList.remove("hidden");showQ()}
function showQ(){answered=false;let q=questions[i];
document.getElementById("badge").textContent=q.section==="A+B"?"Ulangkaji A + B":"Bahagian "+q.section;
document.getElementById("num").textContent=`Soalan ${i+1} daripada ${questions.length}`;
document.getElementById("question").textContent=q.q;
document.getElementById("score").textContent=`Skor: ${score}`;
document.getElementById("bar").style.width=(i/questions.length*100)+"%";

const fig=document.getElementById("figure");
if(q.figure){
 fig.innerHTML=`<div class="figure">
 <div class="figure-title">🖼️ ${q.figure.title}</div>
 <img src="${q.figure.src}" alt="${q.figure.title}">
 <div class="figure-desc">${q.figure.desc}</div>
 </div>`;
}else{fig.innerHTML=""}

let box=document.getElementById("opts");box.innerHTML="";
q.o.forEach((x,n)=>{let b=document.createElement("button");b.className="opt";b.textContent=String.fromCharCode(65+n)+". "+x;b.onclick=()=>answer(n,b);box.appendChild(b)});
document.getElementById("fb").innerHTML="";document.getElementById("next").classList.add("hidden");
scrollTo({top:0,behavior:"smooth"})}
function answer(n,btn){if(answered)return;answered=true;let q=questions[i],bs=document.querySelectorAll(".opt");bs.forEach(b=>b.disabled=true);let fb=document.getElementById("fb");if(n===q.a){score++;btn.style.background="#dcfce7";btn.style.borderColor="#22c55e";fb.className="feedback ok";fb.textContent="✅ BETUL! Jawapan anda tepat."}else{btn.style.background="#fee2e2";btn.style.borderColor="#ef4444";bs[q.a].style.background="#dcfce7";bs[q.a].style.borderColor="#22c55e";fb.className="feedback no";fb.textContent="❌ SALAH. Jawapan yang betul ialah "+String.fromCharCode(65+q.a)+"."}document.getElementById("score").textContent=`Skor: ${score}`;document.getElementById("bar").style.width=((i+1)/questions.length*100)+"%";document.getElementById("next").textContent=i===questions.length-1?"LIHAT KEPUTUSAN 🎯":"SOALAN SETERUSNYA ➜";document.getElementById("next").classList.remove("hidden")}
function nextQ(){if(i<questions.length-1){i++;showQ()}else{result()}}
function result(){document.getElementById("game").classList.add("hidden");document.getElementById("result").classList.remove("hidden");let p=Math.round(score/questions.length*100);document.getElementById("student").textContent=name+" • "+klass;document.getElementById("final").textContent=score+" / "+questions.length;document.getElementById("pct").textContent=p+"%";document.getElementById("msg").textContent=p>=80?"Sangat baik! Teruskan ulang kaji.":p>=60?"Baik! Ulang kaji semula topik yang masih kurang dikuasai.":"Teruskan latihan dan ulang kaji semula topik dalam bahan."}
async function sendScore(){let b=document.getElementById("send"),s=document.getElementById("status"),p=Math.round(score/questions.length*100);b.disabled=true;s.textContent="Menghantar skor...";try{await fetch(WEB_APP_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({nama:name,kelas:klass,skor:score+"/"+questions.length,peratus:p+"%"})});s.textContent="✅ Skor telah dihantar. Sila semak Google Sheets."}catch(e){s.textContent="⚠️ Penghantaran gagal. Semak Web App Google Sheets.";b.disabled=false}}
</script></body></html>
